<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainfall exposure</title>
<style>
  :root { --ink: #1f2933; --muted: #616e7c; --line: #d9dee3; --accent: #1f5fa8; --bad: #a32020; --bad-bg: #fbeaea; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; color: var(--ink); background: #f7f8fa;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1 1 180px; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 6px; }
  button { padding: 10px 18px; font: inherit; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .card { margin-top: 20px; padding: 16px 20px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .card h2 { font-size: 1.15rem; margin: 0 0 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .big { font-size: 1.3rem; font-weight: 600; }
  small { display: block; color: var(--muted); font-size: .8rem; }
  .error { margin-top: 20px; padding: 12px 16px; border: 1px solid var(--bad); border-radius: 8px; background: var(--bad-bg); color: var(--bad); }
  [hidden] { display: none !important; }
  @media (max-width: 420px) { dl { grid-template-columns: 1fr; gap: 2px; } dt { margin-top: 8px; } }
</style>
</head>
<body>
<main>
  <h1>Rainfall exposure</h1>
  <p class="lead">Type an asset id to see how exposed the property is to heavy rainfall.</p>
  <form id="form">
    <input id="asset" type="text" placeholder="A-200975" autocomplete="off" spellcheck="false" aria-label="Asset id" required>
    <button id="go" type="submit">Look up</button>
  </form>
  <div id="error" class="error" role="alert" hidden></div>
  <section id="result" class="card" hidden>
    <h2 id="title"></h2>
    <dl>
      <dt>Address</dt><dd id="address"></dd>
      <dt>Type</dt><dd id="type"></dd>
      <dt>Insured value</dt><dd id="value"></dd>
      <dt>Nearest station</dt><dd id="station"></dd>
      <dt>Wet days</dt><dd><span id="wet" class="big"></span><small>Local days (Europe/Copenhagen) with at least 20.0 mm of rain at the nearest station.</small></dd>
      <dt>Worst 3 days</dt><dd><span id="worst" class="big"></span><small id="worstdates"></small><small>Highest total over three consecutive local days.</small></dd>
      <dt>Period</dt><dd id="period"></dd>
    </dl>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form"), input = $("asset"), button = $("go"), errorBox = $("error"), result = $("result");
  const dkk = new Intl.NumberFormat("en-GB");
  const km = (m) => (m / 1000).toFixed(1) + " km";
  const mm = (v) => v.toFixed(1) + " mm";

  function showError(message) {
    result.hidden = true;
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function render(d) {
    $("title").textContent = "Asset " + d.asset_id;
    $("address").textContent = d.address;
    $("type").textContent = d.asset_type;
    $("value").textContent = dkk.format(d.insured_value_dkk) + " DKK";
    $("station").textContent = d.station.station_id + " (" + d.station.station_name + "), " + km(d.station.distance_m) + " away";
    $("wet").textContent = d.wet_days + (d.wet_days === 1 ? " day" : " days");
    $("worst").textContent = mm(d.worst_3day_mm);
    $("worstdates").textContent = d.worst_3day_start + " to " + d.worst_3day_end;
    $("period").textContent = d.period.start + " to " + d.period.end + " (" + d.period.days_observed + " days observed)";
    errorBox.hidden = true;
    result.hidden = false;
  }

  async function lookup(id) {
    button.disabled = true;
    try {
      const response = await fetch("/assets/" + encodeURIComponent(id) + "/exposure", { headers: { Accept: "application/json" } });
      let body = null;
      try { body = await response.json(); } catch (e) { body = null; }
      if (response.ok) {
        render(body);
      } else {
        const detail = body && body.detail ? String(body.detail) : response.status + " " + response.statusText;
        const prefix = response.status === 404 ? "Not found: " : response.status === 409 ? "Ambiguous id in the source data: " : "Error: ";
        showError(prefix + detail);
      }
    } catch (e) {
      showError("Could not reach the service. Is it running?");
    } finally {
      button.disabled = false;
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const id = input.value.trim();
    if (!id) return;
    const url = new URL(window.location);
    url.searchParams.set("asset_id", id);
    history.replaceState(null, "", url);
    lookup(id);
  });

  const initial = new URLSearchParams(window.location.search).get("asset_id");
  if (initial && initial.trim()) {
    input.value = initial.trim();
    lookup(initial.trim());
  }
</script>
</body>
</html>
