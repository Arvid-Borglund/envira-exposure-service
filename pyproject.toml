[project]
name = "envira-exposure-service"
version = "0.1.0"
description = "Heavy-rainfall exposure for insured assets (Envira practical case)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyproj>=3.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exposure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
